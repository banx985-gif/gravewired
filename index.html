<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#050914" />
    <title>Gravewired</title>
    <!-- INTERACT_01: Aaron's title logo as the website's share picture (the loading screen shows it too) -->
    <meta property="og:title" content="Gravewired" />
    <meta property="og:image" content="./art_opt/pic/title.webp" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./app-icon/icon-192.png" />
    <link rel="apple-touch-icon" href="./app-icon/icon-192.png" />
    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
      html, body { margin: 0; padding: 0; height: 100%; background: #050914; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; touch-action: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #game { position: relative; overflow: hidden; }
      #game canvas { display: block; touch-action: none; }
      /* held upright in the browser: ask for sideways (the installed app is locked to landscape) */
      #rotate { position: fixed; inset: 0; z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; background: #050914; color: #fff; font: 700 24px system-ui, sans-serif; text-align: center; padding: 24px; }
      #rotate .ph { width: 64px; height: 108px; border: 5px solid #22e3ff; border-radius: 14px; box-shadow: 0 0 18px #22e3ff;
        animation: gw-turn 2.2s ease-in-out infinite; }
      #rotate small { color: #9fb3e0; font-size: 17px; font-weight: 600; }
      @keyframes gw-turn { 0%, 25% { transform: rotate(0deg); } 55%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) { #rotate { display: flex; } }
    </style>
    <script type="module" crossorigin src="./assets/index-DcUjj1wj.js"></script>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div class="ph"></div>Turn your phone sideways<small>Gravewired plays in landscape</small></div>
  </body>
</html>
